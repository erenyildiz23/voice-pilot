name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and endpoint tests
        run: python -m pytest -q
      - name: Smoke eval (fails on any leak or missed handoff)
        run: python eval/run_eval.py
